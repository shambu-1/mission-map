services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: missionmap
      POSTGRES_PASSWORD: missionmap
      POSTGRES_DB: missionmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionmap"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://missionmap:missionmap@db:5432/missionmap
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-please}
      CORS_ORIGINS: '["http://localhost:4200"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
